<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <title>Ruta de radicación en Aquarius: ingresar, radicar y consultar</title>
  <defs>
    <marker id="punta" viewBox="0 0 16 16" refX="14" refY="8" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M0 0 L16 8 L0 16 z" fill="#645aff"/>
    </marker>
  </defs>
  <g>
    <rect x="20" y="25" width="240" height="180" rx="18" fill="#001969"/>
    <circle cx="140" cy="62" r="22" fill="#ffffff"/>
    <text x="140" y="71" text-anchor="middle" font-size="26" font-weight="700" fill="#001969">1</text>
    <text x="140" y="118" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">Ingresa al portal</text>
    <text x="140" y="148" text-anchor="middle" font-size="16" fill="#e6e6ff">Portal de tu aseguradora</text>
    <text x="140" y="172" text-anchor="middle" font-size="16" fill="#e6e6ff">Radicación Cuentas Médicas</text>
  </g>
  <g>
    <rect x="330" y="25" width="240" height="180" rx="18" fill="#001969"/>
    <circle cx="450" cy="62" r="22" fill="#ffffff"/>
    <text x="450" y="71" text-anchor="middle" font-size="26" font-weight="700" fill="#001969">2</text>
    <text x="450" y="118" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">Radica tu cuenta</text>
    <text x="450" y="148" text-anchor="middle" font-size="16" fill="#e6e6ff">Radicar Documentos</text>
    <text x="450" y="172" text-anchor="middle" font-size="16" fill="#e6e6ff">formulario y archivos</text>
  </g>
  <g>
    <rect x="640" y="25" width="240" height="180" rx="18" fill="#001969"/>
    <circle cx="760" cy="62" r="22" fill="#ffffff"/>
    <text x="760" y="71" text-anchor="middle" font-size="26" font-weight="700" fill="#001969">3</text>
    <text x="760" y="118" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">Consulta el estado</text>
    <text x="760" y="148" text-anchor="middle" font-size="16" fill="#e6e6ff">Gestión de radicados</text>
    <text x="760" y="172" text-anchor="middle" font-size="16" fill="#e6e6ff">con tu número de radicado</text>
  </g>
  <line x1="266" y1="115" x2="322" y2="115" stroke="#645aff" stroke-width="5" marker-end="url(#punta)"/>
  <line x1="576" y1="115" x2="632" y2="115" stroke="#645aff" stroke-width="5" marker-end="url(#punta)"/>
</svg>
